<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="#09090b" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#27272a" stroke-width="3" />

  <!-- Target Radar Concentric Pulse Circles -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#3b82f6" stroke-opacity="0.15" stroke-width="8" stroke-dasharray="16 12" />
  <circle cx="256" cy="256" r="110" fill="none" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="6" />
  <circle cx="256" cy="256" r="60" fill="none" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="4" />

  <!-- Center Laser Ping Dot -->
  <circle cx="256" cy="256" r="12" fill="url(#grad)" filter="url(#glow)" />

  <!-- Fast Forward / Track Arrow Indicator -->
  <path d="M190 320 L270 240 L350 240 M270 240 L330 180" fill="none" stroke="#60a5fa" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
  <polyline points="230,160 350,160 350,280" fill="none" stroke="#3b82f6" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
</svg>
